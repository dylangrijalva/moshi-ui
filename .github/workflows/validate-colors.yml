name: Validate Moshi color tokens

on:
  push:
    paths:
      - 'tokens/colors/**'
      - 'scripts/validate-colors.mjs'
      - '.github/workflows/validate-colors.yml'
  pull_request:
    paths:
      - 'tokens/colors/**'
      - 'scripts/validate-colors.mjs'
      - '.github/workflows/validate-colors.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate tokens, aliases, Radix snapshots and contrast
        run: node scripts/validate-colors.mjs
